# Unit tests + Kover coverage gate, and the minified release build, on every push to master. What runs and how to reproduce: wiki/workflows/ci.md
name: Tests

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      # Caches the Gradle home and validates the wrapper. Basic (MIT, actions/cache) caching instead of the default
      # proprietary "enhanced" provider, which is only a free preview for private repos.
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      # Robolectric downloads its android-all jars on first use; keep them between runs.
      - uses: actions/cache@v6
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-${{ hashFiles('gradle/libs.versions.toml') }}

      - name: Tests and coverage gate
        run: ./gradlew --continue testDebugUnitTest koverVerify koverHtmlReportDebug koverXmlReportDebug

      # The minified release (R8, #73) must build, and the on-device smoke test that runs against it must compile.
      # The smoke test itself runs on a device, by hand: wiki/workflows/build-and-run.md
      - name: Minified release build
        run: ./gradlew assembleRelease compileSmokeAndroidTestKotlin

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: |
            app/build/reports/kover/htmlDebug/
            app/build/reports/kover/reportDebug.xml
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            app/build/reports/tests/testDebugUnitTest/
            app/build/test-results/testDebugUnitTest/
          if-no-files-found: ignore
          retention-days: 14
