# Unit tests + Kover coverage gate, lint, and the minified release build, on every push to master and every PR into it. What runs and how to reproduce: wiki/workflows/ci.md
name: Tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

# A newer push to a PR cancels that PR's older run. Every other run (a push to master, a manual run) has a group of its
# own, so none is ever cancelled or replaced (#119): wiki/workflows/ci.md -> What runs
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('tests-{0}', github.ref) || format('tests-run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      # Caches the Gradle home and validates the wrapper. Basic (MIT, actions/cache) caching instead of the default
      # proprietary "enhanced" provider, which is only a free preview for private repos.
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      # Robolectric downloads its android-all jars on first use. An entry's key ends in a hash of its jar list, so a
      # run that downloads a new jar (a test pins a new SDK) saves a new entry; restore takes the newest one for this
      # toml (#94): wiki/workflows/ci.md -> Caches. `key` never matches exactly: saved keys always have the suffix.
      - name: Restore Robolectric jars
        id: robolectric-restore
        uses: actions/cache/restore@v6
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-jars-${{ hashFiles('gradle/libs.versions.toml') }}-
          restore-keys: robolectric-jars-${{ hashFiles('gradle/libs.versions.toml') }}-

      - name: Robolectric jars before the tests
        run: .github/scripts/robolectric-jars.sh ~/.m2/repository/org/robolectric robolectric-jars-${{ hashFiles('gradle/libs.versions.toml') }}-

      # The Gradle distribution, cached on its own key. setup-gradle's basic cache key hashes every Gradle file, so a
      # PR that bumps a dependency misses it, and services.gradle.org timed out or answered 504 on such runs (#116).
      # This key changes only with the wrapper version, and PR runs restore entries saved on master.
      - uses: actions/cache@v6
        with:
          path: ~/.gradle/wrapper/dists
          key: gradle-wrapper-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties') }}

      # Download the distribution (on a cache miss) with retries: the wrapper itself tries once.
      - name: Gradle distribution
        run: for attempt in 1 2 3; do ./gradlew --version && exit 0; sleep 30; done; exit 1

      - name: Tests and coverage gate
        run: ./gradlew --continue testDebugUnitTest koverVerify koverHtmlReportDebug koverXmlReportDebug

      # A jar the tests downloaded shows up here and not in the list before the tests. Saved only when the set changed,
      # and only after green tests, so a jar cut off by a failing run is never cached.
      - name: Robolectric jars after the tests
        id: robolectric-jars
        run: .github/scripts/robolectric-jars.sh ~/.m2/repository/org/robolectric robolectric-jars-${{ hashFiles('gradle/libs.versions.toml') }}-

      - name: Save Robolectric jars
        if: steps.robolectric-jars.outputs.count != '0' && steps.robolectric-jars.outputs.key != steps.robolectric-restore.outputs.cache-matched-key
        uses: actions/cache/save@v6
        with:
          path: ~/.m2/repository/org/robolectric
          key: ${{ steps.robolectric-jars.outputs.key }}

      # Lint errors fail the run; warnings don't (#126). One variant: release and smoke lint the same sources.
      - name: Lint
        run: ./gradlew lintDebug

      # The minified release (R8, #73) must build, and the on-device smoke test that runs against it must compile.
      # The smoke test itself runs on a device, by hand: wiki/workflows/build-and-run.md
      - name: Minified release build
        run: ./gradlew assembleRelease compileSmokeAndroidTestKotlin

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: |
            app/build/reports/kover/htmlDebug/
            app/build/reports/kover/reportDebug.xml
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            app/build/reports/tests/testDebugUnitTest/
            app/build/test-results/testDebugUnitTest/
            app/build/reports/lint-results-debug.*
          if-no-files-found: ignore
          retention-days: 14
