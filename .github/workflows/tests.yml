# Unit tests + Kover coverage gate on every push to master. What runs and how to reproduce: wiki/workflows/ci.md
name: Tests

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # Caches the Gradle home and validates the wrapper.
      - uses: gradle/actions/setup-gradle@v4

      # Robolectric downloads its android-all jars on first use; keep them between runs.
      - uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-${{ hashFiles('gradle/libs.versions.toml') }}

      - name: Tests and coverage gate
        run: ./gradlew --continue testDebugUnitTest koverVerify koverHtmlReportDebug koverXmlReportDebug

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            app/build/reports/kover/htmlDebug/
            app/build/reports/kover/reportDebug.xml
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            app/build/reports/tests/testDebugUnitTest/
            app/build/test-results/testDebugUnitTest/
          if-no-files-found: ignore
          retention-days: 14
