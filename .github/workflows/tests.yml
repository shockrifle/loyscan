# Unit tests + Kover coverage gate, lint, and the minified release build, on every push to master and every PR into it,
# unless ci-gate.sh finds the run needs no gate (#199). What runs and how to reproduce: wiki/workflows/ci.md
name: Tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

# A newer push to a PR cancels that PR's older run. Every other run (a push to master, a manual run) has a group of its
# own, so none is ever cancelled or replaced (#119): wiki/workflows/ci.md -> What runs
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('tests-{0}', github.ref) || format('tests-run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The Decide step reads the Actions API (which runs recorded which tree); nothing in the job writes through the token.
permissions:
  actions: read
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Two commits deep: on a pull request the checkout is GitHub's merge commit, and ci-gate.sh diffs it against its
      # first parent, the base.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2

      # Whether this run needs the gate (#199): wiki/workflows/ci.md -> What runs. Every later step runs only on
      # run=true, except the JDK and Gradle setup (setup=true) and a wiki-only PR's public-safe check (wiki=true); the
      # job itself always runs, so the required `test` check reports green on a skip, not "skipped".
      - name: Decide
        id: gate
        run: .github/scripts/ci-gate.sh
        env:
          EVENT: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}

      - uses: actions/setup-java@v6
        if: steps.gate.outputs.setup == 'true'
        with:
          distribution: temurin
          java-version: 21

      # Caches the Gradle home and validates the wrapper. Basic (MIT, actions/cache) caching instead of the default
      # proprietary "enhanced" provider, which is only a free preview for private repos.
      - uses: gradle/actions/setup-gradle@v6
        if: steps.gate.outputs.setup == 'true'
        with:
          cache-provider: basic

      # Robolectric downloads its android-all jars on first use. An entry's key ends in a hash of its jar list, so a
      # run that downloads a new jar (a test pins a new SDK) saves a new entry; restore takes the newest one for this
      # toml (#94): wiki/workflows/ci.md -> Caches. `key` never matches exactly: saved keys always have the suffix.
      - name: Restore Robolectric jars
        if: steps.gate.outputs.run == 'true'
        id: robolectric-restore
        uses: actions/cache/restore@v6
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-jars-${{ hashFiles('gradle/libs.versions.toml') }}-
          restore-keys: robolectric-jars-${{ hashFiles('gradle/libs.versions.toml') }}-

      - name: Robolectric jars before the tests
        if: steps.gate.outputs.run == 'true'
        run: .github/scripts/robolectric-jars.sh ~/.m2/repository/org/robolectric robolectric-jars-${{ hashFiles('gradle/libs.versions.toml') }}-

      # The Gradle distribution, cached on its own key. setup-gradle's basic cache key hashes every Gradle file, so a
      # PR that bumps a dependency misses it, and services.gradle.org timed out or answered 504 on such runs (#116).
      # This key changes only with the wrapper version, and PR runs restore entries saved on master.
      - uses: actions/cache@v6
        if: steps.gate.outputs.setup == 'true'
        with:
          path: ~/.gradle/wrapper/dists
          key: gradle-wrapper-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties') }}

      # Download the distribution (on a cache miss) with retries: the wrapper itself tries once.
      - name: Gradle distribution
        if: steps.gate.outputs.setup == 'true'
        run: for attempt in 1 2 3; do ./gradlew --version && exit 0; sleep 30; done; exit 1

      # A wiki-only PR skips the gate, but PublicSafeRepoTest reads every tracked file, wiki pages too: the public repo
      # must not take a personal path or email address from a wiki page either (#200, #199).
      - name: Public-safe check (wiki-only PR)
        if: steps.gate.outputs.wiki == 'true'
        run: ./gradlew testDebugUnitTest --tests 'com.bdaniel.loyscan.PublicSafeRepoTest'

      - name: Tests and coverage gate
        if: steps.gate.outputs.run == 'true'
        run: ./gradlew --continue testDebugUnitTest koverVerify koverHtmlReportDebug koverXmlReportDebug

      # A jar the tests downloaded shows up here and not in the list before the tests. Saved only when the set changed,
      # and only after green tests, so a jar cut off by a failing run is never cached.
      - name: Robolectric jars after the tests
        if: steps.gate.outputs.run == 'true'
        id: robolectric-jars
        run: .github/scripts/robolectric-jars.sh ~/.m2/repository/org/robolectric robolectric-jars-${{ hashFiles('gradle/libs.versions.toml') }}-

      - name: Save Robolectric jars
        id: robolectric-save
        if: steps.robolectric-jars.outputs.count != '0' && steps.robolectric-jars.outputs.key != steps.robolectric-restore.outputs.cache-matched-key && steps.gate.outputs.run == 'true'
        uses: actions/cache/save@v6
        with:
          path: ~/.m2/repository/org/robolectric
          key: ${{ steps.robolectric-jars.outputs.key }}

      # Lint errors fail the run; warnings don't (#126). One variant: release and smoke lint the same sources.
      - name: Lint
        if: steps.gate.outputs.run == 'true'
        run: ./gradlew lintDebug

      # The minified release (R8, #73) must build, and the on-device smoke test that runs against it must compile.
      # The smoke test itself runs on a device, by hand: wiki/workflows/build-and-run.md
      - name: Minified release build
        if: steps.gate.outputs.run == 'true'
        run: ./gradlew assembleRelease compileSmokeAndroidTestKotlin

      # The release version scheme, through what Gradle resolves (#74): wiki/workflows/ci.md
      - name: Release build checks
        if: steps.gate.outputs.run == 'true'
        run: .github/scripts/check-release-build.sh

      # The release-signing wizard, run with piped answers in a sandbox HOME (#74): wiki/workflows/ci.md
      - name: Release wizard checks
        if: steps.gate.outputs.run == 'true'
        run: .github/scripts/check-release-wizard.sh

      # What ci-gate.sh decides, case by case in throwaway repos (#199): wiki/workflows/ci.md
      - name: CI gate checks
        if: steps.gate.outputs.run == 'true'
        run: .github/scripts/check-ci-gate.sh

      # The CI and release scripts, and the wizards (#74): shellcheck is preinstalled on ubuntu-latest.
      - name: Shellcheck
        if: steps.gate.outputs.run == 'true'
        run: shellcheck .github/scripts/*.sh scripts/*.sh .claude/skills/wizard/template.sh

      # A green PR run records the tree it tested, so the push that lands this tree on master skips the gate (#199):
      # wiki/workflows/ci.md -> What runs. Not when ci-gate.sh said marker=false (the PR changed what a cache key is
      # made of) or this run saved new Robolectric jars: master then runs in full and saves its caches. Only the name
      # counts. Last of the checking steps; a failed upload only costs master a full run.
      - name: Record the tested tree
        if: success() && github.event_name == 'pull_request' && steps.gate.outputs.marker == 'true' && steps.robolectric-save.outcome == 'skipped' && steps.gate.outputs.run == 'true'
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: tested-tree-${{ steps.gate.outputs.tree }}
          path: ${{ runner.temp }}/tested-tree
          if-no-files-found: error
          retention-days: 14

      - name: Upload coverage report
        if: always() && steps.gate.outputs.run == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: |
            app/build/reports/kover/htmlDebug/
            app/build/reports/kover/reportDebug.xml
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload test reports
        if: failure() && steps.gate.outputs.setup == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            app/build/reports/tests/testDebugUnitTest/
            app/build/test-results/testDebugUnitTest/
            app/build/reports/lint-results-debug.*
          if-no-files-found: ignore
          retention-days: 14
